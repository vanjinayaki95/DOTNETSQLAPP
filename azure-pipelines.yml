# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- master

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '*********'
  imageRepository: 'dotnetcoreapi'
  containerRegistry: 'dotnetregistry654.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  #vmImageName: 'ubuntu-latest'
pool:
  name: 'azureagent'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build

    steps:
    - task: Docker@2
      displayName: Build 
      inputs:
        containerRegistry: 'dotnetregistry654'
        repository: '$(imageRepository)'
        command: 'build'
        Dockerfile: '**/Dockerfile'
        tags: '$(tag)'
    - task: Docker@2
      displayName: push an image to container registry
      inputs:
        containerRegistry: 'dotnetregistry654'
        repository: '$(imageRepository)'
        command: 'push'
        tags: '$(tag)'
    
- stage: Deploy
  displayName: Deploy to app service
  jobs:
  - job: Deploy
    displayName: Deploy to app service 
    steps:
    - task: AzureRmWebAppDeployment@5
      inputs:
        ConnectionType: 'AzureRM'
        azureSubscription: '************'
        appType: 'webAppContainer'
        WebAppName: 'dotnetcore-api-hardcoded'
        DockerNamespace: 'dotnetregistry654.azurecr.io'
        DockerRepository: 'dotnetcoreapi'
        DockerImageTag: '$(tag)'
     
