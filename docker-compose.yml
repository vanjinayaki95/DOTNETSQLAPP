version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "yourStrong(!)Password"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - appnetwork

  dotnetapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotnetcoreapi
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=DotNetAppDb;User Id=sa;Password=yourStrong(!)Password;
    depends_on:
      - sqlserver
    networks:
      - appnetwork

networks:
  appnetwork:
